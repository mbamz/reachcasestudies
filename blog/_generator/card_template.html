<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{BRAND_CSS}}">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:675px;}
  body{
    position:relative;overflow:hidden;
    background:
      radial-gradient({{GLOW_SIZE}}% 88% at {{GLOW_X}}% {{GLOW_Y}}%, {{GLOW_STRONG}} 0%, {{GLOW_SOFT}} 34%, rgba(0,0,0,0) 64%),
      radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / {{GRID}}px {{GRID}}px,
      linear-gradient({{ANGLE}}deg, #101012 0%, #060606 55%, #030303 100%);
    color:{{ACCENT}};
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    font-family:var(--font-head,"DM Sans","Poppins",Arial,sans-serif);
  }
  /* inset frame for depth — kept well inside the 160px-tall grid crop */
  .frame{position:absolute;inset:24px;border:1px solid {{FRAME}};border-radius:22px;pointer-events:none;}
  /* everything critical stays vertically centered so the grid thumbnail never crops it */
  .stack{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .icon{width:222px;height:222px;color:{{ACCENT}};filter:drop-shadow(0 0 42px {{GLOW_DROP}});line-height:0;}
  .icon svg{display:block;width:100%;height:100%;}
  .eyebrow{margin-top:40px;font-weight:800;text-transform:uppercase;
    letter-spacing:.34em;font-size:30px;color:{{ACCENT}};text-align:center;padding-left:.34em;}
  .brand{margin-top:15px;font-weight:600;font-size:15px;letter-spacing:.30em;
    text-transform:uppercase;color:rgba(255,255,255,0.42);text-align:center;padding-left:.30em;}
</style></head>
<body>
  <div class="frame"></div>
  <div class="stack">
    <div class="icon"><!--ICON--></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <div class="brand">Reach Social</div>
  </div>
</body></html>
